<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Enquiry - Pet Shop ni Kris</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <h1>Pet Shop ni Kris</h1>


        <nav>

            <ul>

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="../about.html">About</a>
                </li>

                <li>
                    <a href="../contact.html">Contact</a>
                </li>

                <li>
                    <a href="../suggest.html">Suggest a Pet</a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- MAIN CONTENT -->

    <main>


        <section class="product-card">


            <h2>Order Enquiry</h2>


            <p>
                Interested in one of our pets?
                Fill out the form below to send us an order enquiry.
            </p>



            <form>


                <!-- ORDER DETAILS -->

                <fieldset>

                    <legend>Order Details</legend>


                    <label for="quantity">
                        Quantity:
                    </label>


                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        max="20"
                        required
                    >



                    <!-- DELIVERY METHOD -->

                    <fieldset>

                        <legend>Delivery Method</legend>


                        <label>

                            <input
                                type="radio"
                                id="pickup"
                                name="delivery"
                                value="pickup"
                                required
                            >

                            Pick-up

                        </label>


                        <br>


                        <label>

                            <input
                                type="radio"
                                id="delivery"
                                name="delivery"
                                value="delivery"
                            >

                            Home Delivery

                        </label>


                        <br>


                        <label>

                            <input
                                type="radio"
                                id="meetup"
                                name="delivery"
                                value="meetup"
                            >

                            Meet-up

                        </label>


                    </fieldset>



                    <!-- OPTIONAL EXTRAS -->

                    <fieldset>

                        <legend>Optional Extras</legend>


                        <label>

                            <input
                                type="checkbox"
                                id="food"
                                name="extras"
                                value="food"
                            >

                            Pet Food

                        </label>


                        <br>


                        <label>

                            <input
                                type="checkbox"
                                id="cage"
                                name="extras"
                                value="cage"
                            >

                            Pet Cage

                        </label>


                        <br>


                        <label>

                            <input
                                type="checkbox"
                                id="supplies"
                                name="extras"
                                value="supplies"
                            >

                            Pet Supplies

                        </label>


                    </fieldset>



                    <!-- EMAIL -->

                    <label for="email">
                        Contact Email:
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >


                </fieldset>



                <!-- SUBMIT BUTTON -->

                <button type="submit">
                    Send Order Enquiry
                </button>


            </form>


        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Pet Shop ni Kris. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
